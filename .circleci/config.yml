    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: hsh svgs 12
          command: |
            mkdir -p /tmp/ok
            { set +o pipefail 2>/dev/null; echo "don't panic" | cksum; true ; } > /tmp/ok/cd_cfg
            echo "gate promote: $(wc -c </tmp/ok/cd_cfg) bytes total"
      - persist_to_workspace:
